<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Menu - My Restaurant</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: #fff8f0;
    color: #4a3c31;
    margin: 0;
    padding: 20px;
  }
  h1 {
    color: #c75b12;
    text-align: center;
    margin-bottom: 30px;
  }
  nav {
    margin-bottom: 20px;
  }
  a {
    text-decoration: none;
    color: #c75b12;
    font-weight: bold;
  }
  a:hover {
    text-decoration: underline;
  }
  ul {
    list-style: none;
    padding: 0;
    max-width: 900px;
    margin: 0 auto;
  }
  li {
    background: #f1d9b6;
    margin: 12px 0;
    padding: 15px 15px 15px 80px;
    border-radius: 8px;
    box-shadow: 0 3px 6px rgba(199, 91, 18, 0.2);
    font-weight: 600;
    font-size: 1.1rem;
    color: #4a3c31;
    position: relative;
  }
  li:hover {
    background: #e7c495;
  }
  li img {
    position: absolute;
    left: 15px;
    top: 50%;
    transform: translateY(-50%);
    width: 60px;
    height: 60px;
    border-radius: 8px;
    object-fit: cover;
    box-shadow: 0 2px 8px rgba(199, 91, 18, 0.3);
  }
</style>
</head>
<body>
<nav>
  <a href="PAGE INDEX.HTML">Home</a>
</nav>
<h1>Our Menu</h1>
<ul>
  <li>
    <img src="img/OIP.webp" alt="Bruschetta" />
    <strong>Appetizers:</strong> Bruschetta, Stuffed Mushrooms, Garlic Bread
  </li>
  <li>
    <img src="img/R.jpg" alt="Grilled Chicken" />
    <strong>Main Courses:</strong> Grilled Chicken, Seafood Pasta, Vegetarian Lasagna
  </li>
  <li>
    <img src="img/po.webp" alt="Tiramisu" />
    <strong>Desserts:</strong> Tiramisu, Cheesecake, Gelato
  </li>
  <li>
    <img src="img/yup.jpg" alt="Fresh Juice" />
    <strong>Beverages:</strong> Fresh Juices, Coffee, Soft Drinks
  </li>
</ul>
<a href="PAGE INDEX.HTML" class="home-button" role="button">Back to Home</a>

<style>
  .home-button {
    display: block;
    width: 160px;
    margin: 0 auto;
    padding: 12px 0;
    background: #c75b12;
    color: white;
    font-weight: 700;
    font-size: 1.1rem;
    border: none;
    border-radius: 8px;
    text-align: center;
    cursor: pointer;
    text-decoration: none;
    transition: background-color 0.3s ease;
  }
  .home-button:hover,
  .home-button:focus {
    background: #a14a0d;
  }
</style>

</body>
</html>
