<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Video - My Restaurant</title>
<style>
  body { font-family: Arial, sans-serif; background:#fff8f0; color:#333; margin: 0; padding: 20px; text-align: center; }
  h1 { color: #d2691e; }
  video { max-width: 100%; height: auto; border-radius: 8px; box-shadow: 0 0 10px #d2691e; }
  nav { margin-bottom: 20px; text-align: left; }
  a { text-decoration: none; color: #d2691e; font-weight: bold; }
  a:hover { text-decoration: underline; }
</style>
</head>
<body>
<nav>
  <a href="PAGE INDEX.HTML">Home</a>
</nav>
<h1>Watch Our Restaurant Video</h1>
<video controls>
  <source src="vedio/eat.mp4" type="video/mp4" />
  Your browser does not support the video tag.
</video>
<a href="PAGE INDEX.HTML" class="home-button" role="button">Back to Home</a>

<style>
  .home-button {
    display: block;
    width: 160px;
    margin: 0 auto;
    padding: 12px 0;
    background: #c75b12;
    color: white;
    font-weight: 700;
    font-size: 1.1rem;
    border: none;
    border-radius: 8px;
    text-align: center;
    cursor: pointer;
    text-decoration: none;
    transition: background-color 0.3s ease;
  }
  .home-button:hover,
  .home-button:focus {
    background: #a14a0d;
  }
</style>

</body>
</html>
