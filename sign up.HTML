<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Inscription - My Restaurant</title>
<style>
  body { font-family: Arial, sans-serif; background:#fff8f0; color:#333; margin: 0; padding: 20px; }
  h1 { color: #d2691e; }
  form { background: #f4e1d2; padding: 20px; border-radius: 5px; max-width: 400px; }
  label { display: block; margin: 10px 0 5px; }
  input[type="text"], input[type="email"], input[type="password"] { width: 100%; padding: 8px; box-sizing: border-box; }
  button { margin-top: 15px; background: #d2691e; color: white; border: none; padding: 10px 15px; cursor: pointer; border-radius: 3px;}
  button:hover { background: #a0522d; }
  nav { margin-bottom: 20px; }
  a { text-decoration: none; color: #d2691e; font-weight: bold;}
  a:hover { text-decoration: underline; }
</style>
</head>
<body>
<nav>
  <a href="PAGE INDEX.HTML">Home</a>
</nav>
<h1>Inscription</h1>
<form>
  <label for="name">Full Name</label>
  <input type="text" id="name" name="name" required />
  <label for="email">Email</label>
  <input type="email" id="email" name="email" required />
  <label for="password">Password</label>
  <input type="password" id="password" name="password" required />
  <button type="submit">Sign Up</button>
</form>
  <a href="PAGE INDEX.HTML" class="home-button" role="button">Back to Home</a>

<style>
  .home-button {
    display: block;
    width: 160px;
    margin: 0 auto;
    padding: 12px 0;
    background: #c75b12;
    color: white;
    font-weight: 700;
    font-size: 1.1rem;
    border: none;
    border-radius: 8px;
    text-align: center;
    cursor: pointer;
    text-decoration: none;
    transition: background-color 0.3s ease;
  }
  .home-button:hover,
  .home-button:focus {
    background: #a14a0d;
  }
</style>
 

    

</body>
</html>
